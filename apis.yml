apis:
  - aid: cloverly:cloverly-estimates-api
    name: Cloverly Estimates API
    tags:
      - Carbon
      - Climate
      - Estimates
      - Offsets
      - Sustainability
    humanURL: https://docs.cloverly.com
    baseURL: https://api.cloverly.com
    properties:
      - url: https://docs.cloverly.com
        type: Documentation
      - url: openapi/cloverly-estimates-api-openapi.yml
        type: OpenAPI
      - url: json-schema/cloverly-estimate-schema.json
        type: JSONSchema
    description: >-
      Create and retrieve carbon-offset estimates without committing a purchase. Supports shipping (distance + weight),
      vehicle (distance + fuel efficiency), flights (passenger-miles), electricity (kWh), direct carbon weight, and
      fixed currency amounts. Each estimate returns a slug, the equivalent carbon in grams, the matched offset source,
      and the transaction cost in USD cents, then can be converted to a purchase via the Purchases API.
  - aid: cloverly:cloverly-purchases-api
    name: Cloverly Purchases API
    tags:
      - Carbon
      - Climate
      - Purchases
      - Offsets
      - Retirement
    humanURL: https://docs.cloverly.com
    baseURL: https://api.cloverly.com
    properties:
      - url: https://docs.cloverly.com
        type: Documentation
      - url: openapi/cloverly-purchases-api-openapi.yml
        type: OpenAPI
      - url: json-schema/cloverly-purchase-schema.json
        type: JSONSchema
    description: >-
      Purchase and retire carbon offsets from Cloverly's curated marketplace. Mirrors the Estimates shape (shipping,
      vehicle, flight, electricity, carbon, currency) but immediately reserves and retires credits against a verified
      project. Estimates can be promoted to purchases by posting their slug.
  - aid: cloverly:cloverly-offset-types-api
    name: Cloverly Offset Types API
    tags:
      - Carbon
      - Catalog
      - Climate
      - Offsets
      - Project
    tags_raw:
      - Carbon
      - Catalog
      - Climate
      - Offsets
      - Projects
    humanURL: https://docs.cloverly.com
    baseURL: https://api.cloverly.com
    properties:
      - url: https://docs.cloverly.com
        type: Documentation
      - url: openapi/cloverly-offset-types-api-openapi.yml
        type: OpenAPI
    description: >-
      List the carbon-offset project types and individual offset sources available through Cloverly — including
      reforestation, biochar, direct air capture, renewable energy, methane abatement, and other registry-backed
      projects. Each source records the registry (Verra, Gold Standard, ACR, Climate Action Reserve, Puro.earth, etc.),
      project location, vintage, available tonnes, and price per tonne.
  - aid: cloverly:cloverly-account-api
    name: Cloverly Account API
    tags:
      - Account
      - Carbon
      - Climate
    humanURL: https://docs.cloverly.com
    baseURL: https://api.cloverly.com
    properties:
      - url: https://docs.cloverly.com
        type: Documentation
      - url: openapi/cloverly-account-api-openapi.yml
        type: OpenAPI
    description: >-
      Retrieve the authenticated account record including the configured currency, default offset type preferences, and
      the public/private API key context. Useful for confirming which environment (sandbox vs production) and which key
      tier a client is operating under.
