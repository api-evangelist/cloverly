specificationVersion: '0.23'
description: >-
  Cloverly is an Atlanta-headquartered climate technology company that operates a developer-first carbon-credit
  infrastructure platform. The Cloverly API estimates and purchases verified carbon offsets in real time across a
  curated portfolio of reforestation, biochar, direct air capture, renewable energy, and methane-abatement projects
  sourced from registries such as Verra, Gold Standard, ACR, Climate Action Reserve, and Puro.earth. The Catalyst
  product extends the same platform to project developers managing inventory, pricing, content, payments, and
  omnichannel distribution. In 2024 Cloverly was acquired by Climate Impact X (CIX), the Singapore-based carbon
  exchange, and has since operated as the technology arm powering CIX-aligned voluntary carbon market infrastructure.
